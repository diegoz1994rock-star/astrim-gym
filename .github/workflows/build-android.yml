name: Build APK de clientes

# Se dispara solo (push a main) o a mano desde la pestaña "Actions"
# ("Run workflow"). Produce el APK debug de la app de clientes
# (astrim-cliente-app) como artefacto descargable e instalable en el celular.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: google-services.json (config pública de Firebase para Android)
        # No es secreto: la API key de Android está restringida por package +
        # firma, y la seguridad la dan las Firestore Security Rules. Mismo
        # criterio que la config web inyectada en build-macos.yml.
        run: |
          cat > astrim-cliente-app/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "920110099557",
              "project_id": "astrim-gym",
              "storage_bucket": "astrim-gym.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:920110099557:android:4c2beca93d881fb3352a8c",
                  "android_client_info": {
                    "package_name": "com.astrimgym.cliente"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDrAaTQaY-7cdtUmevk6-eIeKjdrfQVsg0" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Compilar APK debug
        working-directory: astrim-cliente-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ASTRIM-clientes-apk
          path: astrim-cliente-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
