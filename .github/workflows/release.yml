name: Publicar release (todas las apps)

# Compila TODO desde el mismo commit y lo publica como un Release de GitHub
# con los instaladores adjuntos, listos para descargar sin entrar a la
# pestaña Actions:
#   - Panel de escritorio Windows (.exe NSIS)
#   - Panel de escritorio macOS (.dmg universal Intel + Apple Silicon)
#   - APK de recepción / asistencia
#   - APK de clientes
#
# Cómo lanzarlo:
#   A) Etiquetá un commit:  git tag v0.2.0 && git push origin v0.2.0
#   B) O a mano: pestaña "Actions" -> "Publicar release (todas las apps)"
#      -> "Run workflow" y escribí la etiqueta (ej. v0.2.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (ej. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  # Config pública del SDK web de Firebase (astrim-gym) — no son secretos:
  # la seguridad la dan las Firestore Security Rules. Mismos valores que
  # .env.local y que build-macos.yml / build-windows.yml.
  VITE_FIREBASE_API_KEY: AIzaSyCRJ55jGT4HxNwN7Xs4SE-NEHqAL1YA_qU
  VITE_FIREBASE_AUTH_DOMAIN: astrim-gym.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: astrim-gym
  VITE_FIREBASE_STORAGE_BUCKET: astrim-gym.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "920110099557"
  VITE_FIREBASE_APP_ID: "1:920110099557:web:f9116b8179d4ad74352a8c"

jobs:
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Compilar panel de escritorio (.exe instalador NSIS)
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Compilar panel de escritorio (.dmg universal)
        run: npm run tauri build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  recepcion-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astrim-recepcion/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Instalar dependencias
        working-directory: astrim-recepcion
        run: npm ci
      - name: Compilar APK debug (Tauri Android)
        working-directory: astrim-recepcion
        run: npm run tauri android build -- --apk --debug
      - name: Renombrar el APK
        run: |
          mkdir -p out
          cp astrim-recepcion/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk \
             out/ASTRIM-Recepcion-Asistencia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-recepcion-apk
          path: out/ASTRIM-Recepcion-Asistencia.apk
          if-no-files-found: error

  clientes-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: google-services.json (config pública de Firebase para Android)
        run: |
          cat > astrim-cliente-app/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "920110099557",
              "project_id": "astrim-gym",
              "storage_bucket": "astrim-gym.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:920110099557:android:4c2beca93d881fb3352a8c",
                  "android_client_info": {
                    "package_name": "com.astrimgym.cliente"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDrAaTQaY-7cdtUmevk6-eIeKjdrfQVsg0" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Compilar APK debug
        working-directory: astrim-cliente-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renombrar el APK
        run: |
          mkdir -p out
          cp astrim-cliente-app/app/build/outputs/apk/debug/app-debug.apk \
             out/ASTRIM-Clientes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-clientes-apk
          path: out/ASTRIM-Clientes.apk
          if-no-files-found: error

  publish:
    needs: [desktop-windows, desktop-macos, recepcion-apk, clientes-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Listar lo que se va a publicar
        run: ls -R dist
      - name: Crear / actualizar el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
