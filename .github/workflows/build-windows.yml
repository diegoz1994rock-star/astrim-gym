name: Build Windows app

# Se dispara solo (push a main) o a mano desde la pestaña "Actions"
# ("Run workflow"). Produce el instalador de Windows (.exe / .msi) del panel
# como artefacto descargable. Mismo criterio que build-macos.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar app de escritorio (.exe instalador NSIS)
        run: npm run tauri build -- --bundles nsis
        env:
          # Config pública del SDK web de Firebase (astrim-gym) — no son
          # secretos: la seguridad la dan las Firestore Security Rules.
          VITE_FIREBASE_API_KEY: AIzaSyCRJ55jGT4HxNwN7Xs4SE-NEHqAL1YA_qU
          VITE_FIREBASE_AUTH_DOMAIN: astrim-gym.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: astrim-gym
          VITE_FIREBASE_STORAGE_BUCKET: astrim-gym.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "920110099557"
          VITE_FIREBASE_APP_ID: "1:920110099557:web:f9116b8179d4ad74352a8c"

      - name: Subir el instalador como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ASTRIM-GYM-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
