[package]
name = "astrim-recepcion"
version = "0.1.0"
description = "ASTRIM GYM Recepción"
authors = ["ASTRIM GYM"]
edition = "2021"

[lib]
name = "astrim_recepcion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
